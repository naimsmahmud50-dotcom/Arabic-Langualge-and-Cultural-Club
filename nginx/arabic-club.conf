# ==============================================================================
# DEVELOPER NOTE:
# File: nginx/arabic-club.conf
# Description: Production Nginx Reverse Proxy with Let's Encrypt TLS & Cloudflare Ingress.
# Institution: Kabi Nazrul Government College, Dhaka
# Target Upstream: 127.0.0.1:3005 (Arabic Club Next.js Service)
# Strictly human vibe; zero AI emojis.
# ==============================================================================

# Upstream definition for Next.js application daemon
upstream arabic_club_backend {
    server 127.0.0.1:3005;
    keepalive 32;
}

# 1. HTTP Server - Redirects all unencrypted traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name arabicclub.org www.arabicclub.org admin.arabicclub.org;

    # Let's Encrypt ACME challenge webroot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Permanent 301 Redirect to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Server - Hardened Reverse Proxy
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name arabicclub.org www.arabicclub.org;

    # SSL / TLS Certificate Configuration (Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/arabicclub.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arabicclub.org/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # Modern TLS Protocols and Cipher Suites (Mozilla Intermediate Standard)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;

    # OCSP Stapling for Fast TLS Handshake
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/arabicclub.org/chain.pem;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # Maximum file upload size (aligned with 10MB media asset upload limit)
    client_max_body_size 25M;

    # Gzip Compression Optimization
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    # Security Headers (Defense in Depth)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), browsing-topics=()" always;

    # Static Asset Caching - Next.js compiled chunks (immutable hash in filenames)
    location /_next/static/ {
        proxy_pass http://arabic_club_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Static Assets & Placeholders
    location /assets/ {
        proxy_pass http://arabic_club_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400";
        access_log off;
    }

    # Dedicated Media Upload Storage Route
    location /api/media/ {
        proxy_pass http://arabic_club_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
    }

    # Root Reverse Proxy to Port 3005
    location / {
        proxy_pass http://arabic_club_backend;
        proxy_http_version 1.1;

        # WebSocket & HTTP/1.1 Upgrade headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Client IP and Host headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Cloudflare Integration: Pass real visitor IP if behind Cloudflare CDN
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header CF-Ray $http_cf_ray;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Custom Error Pages
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}

# 3. Dedicated Admin Subdomain HTTPS Server (admin.arabicclub.org)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.arabicclub.org;

    # SSL / TLS Certificate Configuration (Let's Encrypt / Wildcard or Multi-domain)
    ssl_certificate /etc/letsencrypt/live/arabicclub.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arabicclub.org/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # Modern TLS Protocols and Cipher Suites
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;

    # Maximum file upload size for administrative media uploads
    client_max_body_size 25M;

    # Gzip Compression Optimization
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript image/svg+xml;

    # Administrative Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;

    # Static Asset Caching - Next.js compiled chunks
    location /_next/static/ {
        proxy_pass http://arabic_club_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 365d;
        access_log off;
    }

    # Static Assets & Placeholders
    location /assets/ {
        proxy_pass http://arabic_club_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 30d;
        access_log off;
    }

    # Administrative Reverse Proxy
    location / {
        proxy_pass http://arabic_club_backend;
        proxy_http_version 1.1;

        # WebSocket & HTTP/1.1 Upgrade headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Client IP and Subdomain Host headers (Enables Next.js Subdomain Middleware)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Cloudflare Integration
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header CF-Ray $http_cf_ray;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Custom Error Pages
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}

